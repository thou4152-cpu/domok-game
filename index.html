<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#252525"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="두목 게임즈"><link rel="manifest" href="manifest.json"><title>두목 게임즈</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#dfe8d5;font-family:-apple-system,system-ui,sans-serif;color:#29261f;overscroll-behavior:none}header{padding:max(14px,env(safe-area-inset-top)) 14px 12px;background:#252525;color:white;display:flex;justify-content:space-between;position:sticky;top:0;z-index:3}.gold{color:#ffe15d}.wrap{max-width:760px;margin:auto;padding:10px}.card{background:#fff9e8;border:3px solid #514a3e;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:3px 3px #9da592}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat{text-align:center;background:#eee4c6;padding:7px;border-radius:6px;font-size:12px}.stat b{display:block;font-size:18px}.office{background:linear-gradient(#d6efca 72%,#c9935f 72%);min-height:205px}.people{display:flex;flex-wrap:wrap;gap:6px;min-height:105px;align-items:flex-end}.emp{width:105px;background:#b87c4c;border:3px solid #664025;border-radius:6px;text-align:center;padding:5px;color:white}.face{font-size:34px;background:#f3d7ae;border-radius:4px}.work .face{animation:w .3s infinite alternate}@keyframes w{to{transform:translateY(-4px) rotate(3deg)}}button{background:#ffd64f;border:2px solid #554713;border-bottom:5px solid #806b1c;border-radius:8px;padding:11px;font-weight:900;font-size:14px;margin:3px;touch-action:manipulation}button:active{transform:translateY(2px);border-bottom-width:3px}input,select{width:100%;padding:10px;font-size:16px;border:2px solid #756b5a;border-radius:6px;margin:4px 0 7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.progress{height:25px;background:#ddd;border:3px solid #333;border-radius:5px;overflow:hidden}.bar{height:100%;width:0;background:#66c266;transition:.25s}.dev{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}.dev div{text-align:center;background:white;border:2px solid #887d68;border-radius:5px;padding:5px;font-size:12px}.dev b{display:block;font-size:18px}#log{height:130px;overflow:auto;background:#1e1e1e;color:#c9ffb9;padding:8px;font:12px monospace}.review{background:white;border:2px solid #777;padding:8px;border-radius:5px}.big{width:100%;font-size:17px}.green{background:#9ee098}@media(max-width:500px){.stats,.dev{grid-template-columns:repeat(2,1fr)}.emp{width:calc(50% - 4px)}}</style></head>
<body><header><b>🎮 두목 게임즈</b><b id="money" class="gold"></b></header><div class="wrap">
<div class="card stats"><div class="stat">📅<b id="date"></b></div><div class="stat">👥 팬<b id="fans"></b></div><div class="stat">⭐ 명성<b id="rep"></b></div><div class="stat">🏆 랭크<b id="rank"></b></div></div>
<div class="card office"><b>🏢 개발실 <span id="lv"></span></b><div id="people" class="people"></div><button id="hire">👤 채용 300만</button><button id="train">📚 교육 200만</button><button id="expand">🏢 확장</button></div>
<div class="card"><b>📝 새 게임</b><input id="title" value="두목의 야망"><div class="two"><select id="genre"><option>RPG</option><option>시뮬레이션</option><option>액션</option><option>퍼즐</option></select><select id="theme"><option>판타지</option><option>게임회사</option><option>좀비</option><option>수학</option></select></div><select id="scale"><option value="4000000">소형 · 400만원</option><option value="8000000">중형 · 800만원</option><option value="15000000">대형 · 1,500만원</option></select><button id="start" class="big">🚀 개발 시작</button></div>
<div class="card"><b id="project">💤 프로젝트 없음</b><div class="dev"><div>💡 재미<b id="fun">0</b></div><div>🎨 그래픽<b id="gfx">0</b></div><div>🎵 사운드<b id="snd">0</b></div><div>🐛 버그<b id="bugs">0</b></div></div><div class="progress"><div id="bar" class="bar"></div></div><p style="text-align:center"><b id="pct">0%</b></p><button id="work">💻 한 달 개발</button><button id="fix">🔧 버그 수정</button><button id="release" class="green">📦 출시</button></div>
<div class="card"><b>📰 최근 출시</b><div id="review">첫 작품을 만들어보자.</div></div><div class="card"><b>📟 로그</b><div id="log"></div></div>
</div><script>
const $=x=>document.getElementById(x),KEY="dumok-save-v4";let S={money:30000000,y:1,m:1,fans:0,rep:1,released:0,lv:1,best:0,total:0,team:[{n:"두목",s:7,j:"대표"}],p:null};
try{let x=localStorage.getItem(KEY);if(x)S=JSON.parse(x)}catch(e){}
const combos={"RPG|판타지":5,"시뮬레이션|게임회사":6,"액션|좀비":5,"퍼즐|수학":6},names=["민지","유나","준호","소라","태오","하린","도윤"],jobs=["코딩","기획","그래픽","사운드"];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function won(n){return Math.floor(n/10000).toLocaleString()+"만원"}function rank(){return S.rep>=20?"A":S.rep>=14?"B":S.rep>=9?"C":S.rep>=5?"D":S.rep>=3?"E":"F"}function log(t){$("log").innerHTML+="<div>› "+t+"</div>";$("log").scrollTop=99999}
function draw(){ $("money").textContent="💰 "+won(S.money);$("date").textContent=S.y+"년 "+S.m+"월";$("fans").textContent=S.fans.toLocaleString();$("rep").textContent=S.rep;$("rank").textContent=rank();$("lv").textContent="Lv."+S.lv;$("people").innerHTML=S.team.map(e=>`<div class="emp ${S.p?"work":""}"><div class="face">🧑‍💻</div><b>${e.n}</b><br><small>${e.j} · ${e.s}</small></div>`).join("");if(S.p){$("project").textContent="🛠 "+S.p.title+" 개발 중";$("fun").textContent=S.p.fun;$("gfx").textContent=S.p.gfx;$("snd").textContent=S.p.snd;$("bugs").textContent=S.p.bugs;$("bar").style.width=S.p.progress+"%";$("pct").textContent=S.p.progress+"%"}save()}
function tick(){S.m++;if(S.m>12){S.m=1;S.y++}}
$("start").onclick=()=>{if(S.p)return log("이미 개발 중!");let c=+$("scale").value;if(S.money<c)return log("💸 자금 부족!");S.money-=c;S.p={title:$("title").value||"무제",g:$("genre").value,t:$("theme").value,progress:0,fun:0,gfx:0,snd:0,bugs:0};log("🚀 "+S.p.title+" 개발 시작!");draw()};
$("work").onclick=()=>{if(!S.p)return log("먼저 게임을 기획해.");if(S.p.progress>=100)return log("완성됨! 출시하거나 버그를 잡아.");let sk=S.team.reduce((a,e)=>a+e.s,0);S.p.progress=Math.min(100,S.p.progress+Math.max(12,Math.round(sk*1.6)));S.p.fun+=Math.round(sk*(.5+Math.random()));S.p.gfx+=Math.round(sk*(.4+Math.random()*.8));S.p.snd+=Math.round(sk*(.3+Math.random()*.6));S.p.bugs+=Math.floor(Math.random()*(S.team.length*4+2));if(Math.random()<.18){S.p.fun+=12;log("💡 천재적 아이디어! 재미 +12")}tick();if(S.p.progress>=100)log("✅ 개발 완료!");draw()};
$("fix").onclick=()=>{if(!S.p)return log("프로젝트 없음.");let n=Math.min(S.p.bugs,Math.max(3,S.team.reduce((a,e)=>a+e.s,0)));S.p.bugs-=n;tick();log("🔧 버그 "+n+"개 수정.");draw()};
$("release").onclick=()=>{if(!S.p||S.p.progress<100)return log("개발 100% 후 출시 가능.");let bonus=combos[S.p.g+"|"+S.p.t]||0,q=(S.p.fun+S.p.gfx+S.p.snd)/20-S.p.bugs*.13+bonus+S.rep*.15+Math.random()*2-1,score=Math.max(1,Math.min(10,q)),sales=Math.max(300,Math.floor(score*score*850*(1+S.fans/12000))),rev=sales*18000;S.money+=rev;S.fans+=Math.floor(sales*score/100);if(score>=8)S.rep+=2;else if(score>=6)S.rep++;S.released++;S.total+=sales;S.best=Math.max(S.best,score);$("review").innerHTML=`<div class="review"><b>🎮 ${S.p.title}</b><br>⭐ ${score.toFixed(1)}/10<br>📦 ${sales.toLocaleString()}장<br>💰 ${won(rev)}${score>=8?"<br>🔥 대히트!":""}</div>`;log("📦 출시! "+score.toFixed(1)+"점 / "+sales.toLocaleString()+"장");S.p=null;$("project").textContent="💤 프로젝트 없음";["fun","gfx","snd","bugs"].forEach(x=>$(x).textContent=0);$("bar").style.width="0";$("pct").textContent="0%";draw()};
$("hire").onclick=()=>{if(S.team.length>=S.lv*3)return log("🏢 사무실이 꽉 참.");if(S.money<3000000)return log("💸 돈 부족.");S.money-=3000000;S.team.push({n:names[Math.floor(Math.random()*names.length)],s:3+Math.floor(Math.random()*8),j:jobs[Math.floor(Math.random()*jobs.length)]});log("👤 새 직원 채용!");draw()};
$("train").onclick=()=>{if(S.money<2000000)return log("💸 돈 부족.");S.money-=2000000;S.team.forEach(e=>e.s++);tick();log("📚 전 직원 능력 +1");draw()};
$("expand").onclick=()=>{let c=S.lv*10000000;if(S.money<c)return log("💸 확장비 "+won(c)+" 필요.");S.money-=c;S.lv++;log("🏢 사무실 Lv."+S.lv+" 확장!");draw()};
draw();log("💾 자동저장 ON · 두목 게임즈 시작!");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
